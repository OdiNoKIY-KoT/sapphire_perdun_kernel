name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ "lineage-23.2" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq bc bison flex cpio rsync kmod \
            libssl-dev libelf-dev libncurses-dev lz4 zstd device-tree-compiler
          sudo apt update && sudo apt install -y \
          build-essential bc bison flex patch pkg-config git curl tar xz-utils zip unzip \
          cpio rsync kmod perl python3 python-is-python3 libssl-dev libelf-dev pahole \
          libncurses-dev zlib1g-dev libyaml-dev lz4 zstd device-tree-compiler adb fastboot

      - name: Download toolchain
        run: |
          mkdir -p ~/toolchains
          curl -L \
            "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r450784e.tar.gz" \
            -o /tmp/tc.tar.gz
          ls -la /tmp/tc.tar.gz
          mkdir -p ~/toolchains/clang-r450784e
          tar -xzf /tmp/tc.tar.gz -C ~/toolchains/clang-r450784e
          echo "=== Contents ==="
          ls ~/toolchains/clang-r450784e/
          ls ~/toolchains/clang-r450784e/bin/ 2>/dev/null || echo "No bin dir"
          
      - name: Build kernel
        id: build
        run: |
          export PATH="${HOME}/toolchains/clang-r450784e/bin:${PATH}"
          echo "=== Check ==="
          which clang
          which ld.lld
          clang --version | head -1
          echo ""
          echo "=== Kernel $(make kernelversion) ==="
          
          BUILD_OPTS=(-j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++)
          
          make "${BUILD_OPTS[@]}" gki_defconfig
          scripts/kconfig/merge_config.sh -m -O . .config arch/arm64/configs/vendor/kalama_GKI.config
          scripts/kconfig/merge_config.sh -m -O . .config arch/arm64/configs/vendor/sapphire_GKI.config
          make "${BUILD_OPTS[@]}" olddefconfig
          make "${BUILD_OPTS[@]}" Image

      - name: Upload Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: arch/arm64/boot/Image
